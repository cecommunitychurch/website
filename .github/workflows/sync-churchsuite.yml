name: Sync ChurchSuite Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ChurchSuite events
        run: python scripts/sync_churchsuite.py

      # Keep the sitemap's freshness signal in step with the event feed, so
      # crawlers see What's On as genuinely updated rather than stale.
      - name: Refresh sitemap lastmod
        run: |
          TODAY=$(date -u +%F)
          python - "$TODAY" <<'EOF'
          import re, sys, pathlib
          today = sys.argv[1]
          p = pathlib.Path("sitemap.xml")
          s = p.read_text(encoding="utf-8")
          for path in ("/", "/whats-on.html"):
              s = re.sub(
                  r"(<loc>https://cecommunitychurch\.com" + re.escape(path) + r"</loc>\s*<lastmod>)[^<]*",
                  r"\g<1>" + today,
                  s,
              )
          p.write_text(s, encoding="utf-8")
          EOF

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json sitemap.xml
          git diff --staged --quiet || git commit -m "chore: sync ChurchSuite events [skip ci]"
          git push
