<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="brick-club-title">
  <title id="brick-club-title">Brick Club</title>
  <defs>
    <clipPath id="brick-club-body">
      <rect x="6" y="19" width="36" height="19" rx="3"/>
    </clipPath>
  </defs>
  <!-- studs (drawn first so the body overlaps their base) -->
  <g fill="#b84e2c">
    <rect x="11" y="11" width="10" height="9" rx="2"/>
    <rect x="27" y="11" width="10" height="9" rx="2"/>
  </g>
  <g fill="#e2795a">
    <ellipse cx="16" cy="11.4" rx="5" ry="2.5"/>
    <ellipse cx="32" cy="11.4" rx="5" ry="2.5"/>
  </g>
  <!-- brick body -->
  <rect x="6" y="19" width="36" height="19" rx="3" fill="#d8613c"/>
  <!-- top highlight and bottom shadow, clipped to the rounded body -->
  <g clip-path="url(#brick-club-body)">
    <rect x="6" y="19" width="36" height="3.5" fill="#e2795a"/>
    <rect x="6" y="34" width="36" height="4" fill="#b84e2c"/>
  </g>
</svg>
